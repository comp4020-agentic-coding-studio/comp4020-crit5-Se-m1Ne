<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deflect</title>
    <meta
      name="description"
      content="A tiny browser game about drawing lines to redirect a moving ball into a goal."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="sr-only">
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <h1 class="sr-only">Deflect</h1>
    <main>
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="controls" hidden>
        <button id="restart-btn" class="ctrl-btn" type="button" aria-label="Restart">↻</button>
        <button id="pause-btn" class="ctrl-btn" type="button" aria-label="Pause">Ⅱ</button>
        <button id="level-select-btn" class="ctrl-btn" type="button" aria-label="Choose level">▦</button>
      </div>
      <div id="level-panel" class="level-panel" hidden role="dialog" aria-modal="true" aria-label="Choose level">
        <div class="level-panel-card">
          <button id="level-panel-close" class="ctrl-btn level-panel-close" type="button" aria-label="Close level select">×</button>
          <div class="level-grid" id="level-grid"></div>
        </div>
      </div>
      <div id="cover" class="cover">
        <svg class="cover-motif" viewBox="0 0 200 120" width="200" height="120" aria-hidden="true">
          <path class="cover-ink" d="M20,90 C70,20 130,20 180,90" />
          <circle class="cover-ball" r="7" cx="20" cy="90" />
        </svg>
        <p class="cover-title">Deflect</p>
        <button id="start-btn" class="cover-start" type="button" aria-label="Start game">▶</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
